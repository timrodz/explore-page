services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kiki
      POSTGRES_PASSWORD: kiki
      POSTGRES_DB: kiki_explore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiki -d kiki_explore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
